<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John Walter Roberts · A Journey</title>
  <meta name="description" content="An interactive map following the life and travels of John Walter Roberts (1880–1961), with discoveries from his records and the world events he lived through.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%238b2e1f'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' text-anchor='middle' fill='%23f4ecd8'%3EJR%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map" aria-label="Map of John Walter Roberts's journey"></div>

  <article id="card" class="card" aria-live="polite"></article>

  <div class="tools" role="toolbar" aria-label="Map tools">
    <button id="btn-overview" class="tool" type="button" title="See the whole journey (O)">Whole journey</button>
    <button id="btn-present" class="tool" type="button" title="Full screen with a 2-minute timer (P)">Present</button>
  </div>

  <div id="timer" class="timer" hidden aria-live="off">0:00</div>

  <section id="timeline" class="timeline" aria-label="Timeline of his life, 1880 to 1961">
    <div class="tl-track" id="tl-track"></div>
  </section>

  <noscript><p class="noscript">This map needs JavaScript turned on.</p></noscript>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/journey.js"></script>
  <script src="data/world-events.js"></script>
  <script src="data/photos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
